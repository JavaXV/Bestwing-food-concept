<!doctype html>

<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="utf-8">


    <!-- Responsive viewport -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >


    <!-- Page title -->
    <title>
        Dashboard
    </title>


    <!-- Bootstrap 5.3.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


    <!-- Navigation bar -->
    <nav
        class="navbar bg-white shadow-sm"
    >

        <div class="container">


            <!-- Dashboard title -->
            <span class="navbar-brand brand">

                My Dashboard

            </span>


            <!-- Logout button -->
            <button
                onclick="logout()"
                class="btn btn-outline-danger"
            >

                Logout

            </button>


        </div>

    </nav>


    <!-- Main dashboard content -->
    <main
        class="container py-4"
    >


        <!-- Message area -->
        <div id="msg"></div>


        <!-- User information container -->
        <div
            id="content"
            class="row g-4"
        ></div>


    </main>


    <!-- Common JavaScript -->
    <script src="/js/common.js"></script>


    <script>


        /*
        |--------------------------------------------------------------------------
        | LOAD DASHBOARD
        |--------------------------------------------------------------------------
        */

        async function load() {


            try {


                /*
                |--------------------------------------------------------------------------
                | REQUEST CURRENT USER
                |--------------------------------------------------------------------------
                |
                | api() comes from /js/common.js.
                |
                | It should automatically attach:
                |
                | Authorization: Bearer JWT_TOKEN
                |
                */

                const d =
                    await api(
                        '/api/user/me'
                    );


                /*
                |--------------------------------------------------------------------------
                | GET USER OBJECT
                |--------------------------------------------------------------------------
                */

                const u =
                    d.user;


                /*
                |--------------------------------------------------------------------------
                | DISPLAY USER INFORMATION
                |--------------------------------------------------------------------------
                */

                document.getElementById(
                    'content'
                ).innerHTML =


                    `

                    <!-- Welcome section -->

                    <div class="col-12">

                        <div class="card p-4">

                            <h3>

                                Welcome,
                                ${u.full_name}

                            </h3>

                            <p class="muted">

                                Your complete
                                registration information

                            </p>

                        </div>

                    </div>


                    <!-- Personal information -->

                    <div class="col-md-6">

                        <div class="card p-4">

                            <h5>

                                Personal Information

                            </h5>


                            <hr>


                            <p>

                                <b>
                                    Full name:
                                </b>

                                ${u.full_name}

                            </p>


                            <p>

                                <b>
                                    Email:
                                </b>

                                ${u.email}

                            </p>


                            <p>

                                <b>
                                    Phone:
                                </b>

                                ${u.phone_number}

                            </p>


                            <p>

                                <b>
                                    Gender:
                                </b>

                                ${u.gender}

                            </p>


                            <p>

                                <b>
                                    Referral:
                                </b>

                                ${u.referral || 'N/A'}

                            </p>

                        </div>

                    </div>


                    <!-- Account information -->

                    <div class="col-md-6">

                        <div class="card p-4">

                            <h5>

                                Account

                            </h5>


                            <hr>


                            <!-- Payment status -->

                            <p>

                                <b>
                                    Payment:
                                </b>


                                <span
                                    class="status ${
                                        u.payment_status === 'paid'
                                            ? 'status-paid'
                                            : 'status-pending'
                                    }"
                                >

                                    ${u.payment_status}

                                </span>

                            </p>


                            <!-- Account status -->

                            <p>

                                <b>
                                    Account status:
                                </b>

                                ${u.account_status}

                            </p>


                            <!-- Account name -->

                            <p>

                                <b>
                                    Account name:
                                </b>

                                ${u.account_name ||
                                'Not assigned yet'}

                            </p>


                            <!-- Account number -->

                            <p>

                                <b>
                                    Account number:
                                </b>

                            </p>


                            <div
                                class="account-box"
                            >

                                ${
                                    u.account_number ||
                                    'Pending payment approval'
                                }

                            </div>


                        </div>

                    </div>

                    `;


            } catch (e) {


                /*
                |--------------------------------------------------------------------------
                | DISPLAY ERROR
                |--------------------------------------------------------------------------
                */

                document.getElementById(
                    'msg'
                ).innerHTML =


                    `

                    <div class="alert alert-danger">

                        ${e.message}

                    </div>

                    `;


                /*
                |--------------------------------------------------------------------------
                | CHECK FOR TOKEN ERROR
                |--------------------------------------------------------------------------
                |
                | If the JWT is missing or invalid,
                | send the user back to login.
                |
                */

                if (

                    e.message
                        .toLowerCase()
                        .includes('token')

                ) {


                    setTimeout(

                        () => {

                            location.href =
                                '/login.html';

                        },

                        800

                    );

                }

            }

        }


        /*
        |--------------------------------------------------------------------------
        | LOAD DASHBOARD WHEN PAGE OPENS
        |--------------------------------------------------------------------------
        */

        load();


    </script>


</body>

</html>

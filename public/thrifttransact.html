/* =====================================================
   GLOBAL
===================================================== */

/* =====================================================

===================================================== */

===================================================== */

<script>

/* =====================================================
   CONFIGURATION
===================================================== */

/*
|--------------------------------------------------------------------------
| Change this only if your API is mounted somewhere else.
|--------------------------------------------------------------------------
*/

const API_BASE =
    "/api/thrift";


/*
|--------------------------------------------------------------------------
| Backend endpoint
|--------------------------------------------------------------------------
*/

const SUBSCRIPTIONS_ENDPOINT =
    API_BASE +
    "/my-subscriptions";


/*
|--------------------------------------------------------------------------
| Weekly history page
|--------------------------------------------------------------------------
*/

const WEEKLY_HISTORY_PAGE =
    "thriftweekly.html";


/* =====================================================
   STATE
===================================================== */

let allTransactions = [];

let filteredTransactions = [];

let currentPage = 1;

let entriesPerPage = 10;


/* =====================================================
   GET AUTH TOKEN
===================================================== */

function getToken() {

    /*
    |--------------------------------------------------------------------------
    | Try the common token names used by the application.
    |--------------------------------------------------------------------------
    */

    return (
        localStorage.getItem("token") ||

        localStorage.getItem("accessToken") ||

        localStorage.getItem("jwt") ||

        sessionStorage.getItem("token") ||

        sessionStorage.getItem("accessToken") ||

        sessionStorage.getItem("jwt") ||

        null
    );

}


/* =====================================================
   API REQUEST
===================================================== */

async function apiRequest(
    url,
    options = {}
) {

    const token =
        getToken();


    const headers = {

        "Content-Type":
            "application/json",

        ...(options.headers || {})

    };


    /*
    |--------------------------------------------------------------------------
    | Add JWT
    |--------------------------------------------------------------------------
    */

    if (token) {

        headers.Authorization =
            "Bearer " + token;

    }


    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );


    /*
    |--------------------------------------------------------------------------
    | Handle expired login
    |--------------------------------------------------------------------------
    */

    if (
        response.status === 401
    ) {

        localStorage.removeItem("token");

        localStorage.removeItem("accessToken");

        localStorage.removeItem("jwt");

        sessionStorage.removeItem("token");

        sessionStorage.removeItem("accessToken");

        sessionStorage.removeItem("jwt");

        alert(
            "Your session has expired. Please login again."
        );

        window.location.href =
            "login.html";

        throw new Error(
            "Unauthorized"
        );

    }


    const data =
        await response.json()
            .catch(
                () => ({})
            );


    if (!response.ok) {

        throw new Error(
            data.message ||
            "Unable to load thrift transactions."
        );

    }


    return data;

}


/* =====================================================
   FORMAT MONEY
===================================================== */

function formatMoney(value) {

    const amount =
        Number(value || 0);


    return "₦" +
        amount.toLocaleString(
            "en-NG",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value) {

    if (!value) {

        return "-";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleDateString(
        "en-GB",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(
    status
) {

    const value =
        String(
            status || ""
        )
            .trim()
            .toLowerCase();


    if (
        value === "active"
    ) {

        return "status-active";

    }


    if (
        value === "completed"
    ) {

        return "status-completed";

    }


    if (
        value === "default"
    ) {

        return "status-default";

    }


    return "status-inactive";

}


/* =====================================================
   NORMALIZE API DATA
===================================================== */

function normalizeSubscription(
    item
) {

    return {

        id:
            item.id ??
            item.thrift_id,

        plans:
            item.plans ??
            item.plan ??
            "-",

        amount:
            Number(
                item.amount || 0
            ),

        profit:
            Number(
                item.profit || 0
            ),

        current_weeks:
            Number(
                item.current_weeks || 0
            ),

        fine_amount:
            Number(
                item.fine_amount || 0
            ),

        start_date:
            item.start_date,

        end_date:
            item.end_date,

        plan_status:
            item.plan_status ??
            item.status ??
            "Active",

        accountno:
            item.accountno ??
            item.account_number ??
            ""

    };

}


/* =====================================================
   LOAD USER THRIFT SUBSCRIPTIONS
===================================================== */

async function loadThriftTransactions() {

    const body =
        document.getElementById(
            "transactionBody"
        );


    body.innerHTML = `

        <tr>

            <td
                colspan="10"
                class="loading-row"
            >

                <span
                    class="loading-spinner"
                ></span>

                Loading thrift transactions...

            </td>

        </tr>

    `;


    try {

        const data =
            await apiRequest(
                SUBSCRIPTIONS_ENDPOINT
            );


        console.log(
            "THRIFT SUBSCRIPTIONS:",
            data
        );


        /*
        |--------------------------------------------------------------------------
        | Accept several common API response formats.
        |--------------------------------------------------------------------------
        */

        let subscriptions = [];


        if (
            Array.isArray(data)
        ) {

            subscriptions =
                data;

        } else if (
            Array.isArray(
                data.subscriptions
            )
        ) {

            subscriptions =
                data.subscriptions;

        } else if (
            Array.isArray(
                data.data
            )
        ) {

            subscriptions =
                data.data;

        } else if (
            Array.isArray(
                data.results
            )
        ) {

            subscriptions =
                data.results;

        }


        allTransactions =
            subscriptions.map(
                normalizeSubscription
            );


        filteredTransactions =
            [...allTransactions];


        currentPage = 1;


        renderTable();


    } catch (error) {

        console.error(
            "LOAD THRIFT ERROR:",
            error
        );


        body.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="error-row"
                >

                    <i class="bi bi-exclamation-triangle"></i>

                    ${escapeHtml(
                        error.message ||
                        "Unable to load thrift transactions."
                    )}

                </td>

            </tr>

        `;


        updateFooter(
            0,
            0,
            0
        );

    }

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable() {

    const body =
        document.getElementById(
            "transactionBody"
        );


    /*
    |--------------------------------------------------------------------------
    | Empty state
    |--------------------------------------------------------------------------
    */

    if (
        filteredTransactions.length === 0
    ) {

        body.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="empty-row"
                >

                    <i class="bi bi-wallet2"></i>

                    No thrift subscription found.

                </td>

            </tr>

        `;


        updateFooter(
            0,
            0,
            0
        );


        renderPagination();


        return;

    }


    /*
    |--------------------------------------------------------------------------
    | Calculate pagination
    |--------------------------------------------------------------------------
    */

    const total =
        filteredTransactions.length;


    const totalPages =
        Math.ceil(
            total /
            entriesPerPage
        );


    if (
        currentPage >
        totalPages
    ) {

        currentPage =
            totalPages;

    }


    const startIndex =
        (
            currentPage - 1
        ) *
        entriesPerPage;


    const endIndex =
        Math.min(
            startIndex +
            entriesPerPage,
            total
        );


    const rows =
        filteredTransactions.slice(
            startIndex,
            endIndex
        );


    /*
    |--------------------------------------------------------------------------
    | Generate rows
    |--------------------------------------------------------------------------
    */

    body.innerHTML =
        rows.map(
            function (
                item,
                index
            ) {

                const serial =
                    startIndex +
                    index +
                    1;


                const status =
                    String(
                        item.plan_status ||
                        "Active"
                    );


                return `

                    <tr>

                        <td>
                            ${serial}
                        </td>


                        <td>
                            ${escapeHtml(
                                item.plans
                            )}
                        </td>


                        <td>
                            ${formatMoney(
                                item.amount
                            )}
                        </td>


                        <td>
                            ${formatMoney(
                                item.profit
                            )}
                        </td>


                        <td>
                            ${item.current_weeks}
                        </td>


                        <td class="fine">
                            ${formatMoney(
                                item.fine_amount
                            )}
                        </td>


                        <td>
                            ${formatDate(
                                item.start_date
                            )}
                        </td>


                        <td>
                            ${formatDate(
                                item.end_date
                            )}
                        </td>


                        <td>

                            <span
                                class="status
                                ${getStatusClass(
                                    status
                                )}"
                            >

                                ${escapeHtml(
                                    status
                                )}

                            </span>

                        </td>


                        <td>

                            <button
                                type="button"
                                class="history-btn"
                                onclick="weeklyHistory(
                                    ${Number(item.id)}
                                )"
                            >

                                <i
                                    class="bi bi-clock-history"
                                ></i>

                                Weekly History

                            </button>

                        </td>

                    </tr>

                `;

            }
        )
        .join("");


    updateFooter(
        startIndex + 1,
        endIndex,
        total
    );


    renderPagination();

}


/* =====================================================
   FOOTER INFORMATION
===================================================== */

function updateFooter(
    start,
    end,
    total
) {

    document.getElementById(
        "entriesInfo"
    ).textContent =

        total === 0

            ? "Showing 0 to 0 of 0 entries"

            :

            `Showing ${start} to ${end} of ${total} entries`;

}


/* =====================================================
   PAGINATION
===================================================== */

function renderPagination() {

    const pagination =
        document.getElementById(
            "pagination"
        );


    const total =
        filteredTransactions.length;


    const totalPages =
        Math.ceil(
            total /
            entriesPerPage
        );


    if (
        totalPages <= 1
    ) {

        pagination.innerHTML = "";

        return;

    }


    let html = "";


    /*
    |--------------------------------------------------------------------------
    | Previous
    |--------------------------------------------------------------------------
    */

    html += `

        <button
            class="page-btn"
            onclick="goToPage(
                ${currentPage - 1}
            )"
            ${currentPage === 1
                ? "disabled"
                : ""}
        >
            Previous
        </button>

    `;


    /*
    |--------------------------------------------------------------------------
    | Page numbers
    |--------------------------------------------------------------------------
    */

    for (
        let page = 1;
        page <= totalPages;
        page++
    ) {

        html += `

            <button
                class="page-btn
                ${page === currentPage
                    ? "active"
                    : ""}"
                onclick="goToPage(
                    ${page}
                )"
            >

                ${page}

            </button>

        `;

    }


    /*
    |--------------------------------------------------------------------------
    | Next
    |--------------------------------------------------------------------------
    */

    html += `

        <button
            class="page-btn"
            onclick="goToPage(
                ${currentPage + 1}
            )"
            ${currentPage === totalPages
                ? "disabled"
                : ""}
        >

            Next

        </button>

    `;


    pagination.innerHTML =
        html;

}


/* =====================================================
   GO TO PAGE
===================================================== */

function goToPage(
    page
) {

    const totalPages =
        Math.ceil(
            filteredTransactions.length /
            entriesPerPage
        );


    if (
        page < 1 ||
        page > totalPages
    ) {

        return;

    }


    currentPage =
        page;


    renderTable();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =====================================================
   NEXT PAGE
===================================================== */

function nextPage() {

    goToPage(
        currentPage + 1
    );

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        function () {

            const search =
                this.value
                    .trim()
                    .toLowerCase();


            filteredTransactions =
                allTransactions.filter(
                    function (item) {

                        return [

                            item.plans,

                            item.amount,

                            item.profit,

                            item.current_weeks,

                            item.fine_amount,

                            item.start_date,

                            item.end_date,

                            item.plan_status,

                            item.accountno

                        ]
                        .join(" ")
                        .toLowerCase()
                        .includes(search);

                    }
                );


            currentPage = 1;


            renderTable();

        }
    );


/* =====================================================
   ENTRIES SELECT
===================================================== */

document
    .getElementById("entriesSelect")
    .addEventListener(
        "change",
        function () {

            entriesPerPage =
                Number(
                    this.value
                );


            currentPage = 1;


            renderTable();

        }
    );


/* =====================================================
   WEEKLY HISTORY
===================================================== */

function weeklyHistory(
    thriftId
) {

    if (!thriftId) {

        alert(
            "Invalid thrift subscription."
        );

        return;

    }


    /*
    |--------------------------------------------------------------------------
    | Pass thrift subscription ID to history page.
    |--------------------------------------------------------------------------
    */

    window.location.href =
        WEEKLY_HISTORY_PAGE +
        "?thrift_id=" +
        encodeURIComponent(
            thriftId
        );

}


/* =====================================================
   SIDEBAR
===================================================== */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle(
            "open"
        );


    document
        .getElementById("overlay")
        .classList.toggle(
            "active"
        );

}


function closeSidebar() {

    document
        .getElementById("sidebar")
        .classList.remove(
            "open"
        );


    document
        .getElementById("overlay")
        .classList.remove(
            "active"
        );

}


/* =====================================================
   DARK MODE
===================================================== */

function toggleSwitch() {

    const toggle =
        document.getElementById(
            "toggle"
        );


    document.body.classList.toggle(
        "dark-mode"
    );


    toggle.classList.toggle(
        "active"
    );


    const darkMode =
        document.body.classList.contains(
            "dark-mode"
        );


    localStorage.setItem(
        "thriftDarkMode",
        darkMode
            ? "1"
            : "0"
    );

}


/* =====================================================
   LOAD SAVED THEME
===================================================== */

function loadTheme() {

    const darkMode =
        localStorage.getItem(
            "thriftDarkMode"
        );


    if (
        darkMode === "1"
    ) {

        document.body.classList.add(
            "dark-mode"
        );


        document
            .getElementById("toggle")
            .classList.add(
                "active"
            );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   LOAD USER INFORMATION
===================================================== */

async function loadUserInformation() {

    /*
    |--------------------------------------------------------------------------
    | This section is optional.
    |
    | If your dashboard already stores user information in localStorage,
    | this will display it.
    |--------------------------------------------------------------------------
    */

    try {

        const possibleUser =
            localStorage.getItem(
                "user"
            );


        if (!possibleUser) {

            return;

        }


        const user =
            JSON.parse(
                possibleUser
            );


        const fullName =
            user.full_name ||
            user.fullName ||
            user.name ||
            "";


        const accountName =
            user.account_name ||
            user.accountName ||
            "";


        const accountNo =
            user.accountno ||
            user.account_number ||
            user.accountNumber ||
            "";


        if (fullName) {

            document.getElementById(
                "welcomeTitle"
            ).textContent =
                "Good Evening, " +
                fullName;

        }


        document.getElementById(
            "userName"
        ).textContent =
            fullName ||
            "User";


        document.getElementById(
            "userAccount"
        ).textContent =
            accountNo ||
            "-";


        if (accountNo) {

            document.getElementById(
                "accountText"
            ).innerHTML =

                escapeHtml(
                    accountName ||
                    "Primary Account"
                ) +

                " Logged in Account ID - " +

                `<strong>
                    ${escapeHtml(accountNo)}
                </strong>

                <span class="primary">
                    (Primary Account)
                </span>`;

        }

    } catch (error) {

        console.warn(
            "Unable to load local user information:",
            error
        );

    }

}


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadTheme();

        loadUserInformation();

        loadThriftTransactions();

    }
);


function weeklyHistory(thriftId) {

    if (!thriftId || Number(thriftId) <= 0) {
        alert("Invalid thrift subscription.");
        return;
    }

    window.location.href =
        "thriftweekly.html?thrift_id=" +
        encodeURIComponent(thriftId);
}

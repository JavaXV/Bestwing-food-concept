<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/logos.png"
    >

    <title>Bestwing Collect - Sign Up</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
        }


        /* =========================================
           SIGN UP PAGE
        ========================================== */

        .login-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }


        /* =========================================
           IMAGE SIDE
        ========================================== */

        .image-side {
            width: 25%;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background: #f5f5f5;
        }


        .side-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center center;
            filter: brightness(0.62);
        }


        .side-logo {
            position: absolute;
            z-index: 5;
            top: 40px;
            left: 35px;
            width: 150px;
            height: auto;
            object-fit: contain;
        }


        /* =========================================
           DIVIDER
        ========================================== */

        .divider {
            width: 5%;
            min-height: 100vh;
            background: #806d82;
        }


        /* =========================================
           FORM SIDE
        ========================================== */

        .form-side {
            width: 70%;
            min-height: 100vh;
            background: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 30px;
        }


        .login-container {
            width: 100%;
            max-width: 472px;
            margin-top: -20px;
        }


        /* =========================================
           TITLE
        ========================================== */

        h1 {
            margin: 0 0 14px;

            color: #270042;

            font-size: 32px;
            font-weight: 700;
        }


        /* =========================================
           INTRO TEXT
        ========================================== */

        .intro {
            margin: 0 0 27px;

            color: #b5b2b5;

            font-size: 15px;
            line-height: 1.35;
            font-weight: 600;
        }


        /* =========================================
           FORM FIELD
        ========================================== */

        .field {
            position: relative;
            margin-bottom: 27px;
        }


        .field input {
            width: 100%;
            height: 50px;

            padding: 21px 22px 5px;

            border: 2px solid #198754;
            border-radius: 5px;

            outline: none;

            font-size: 14px;
            color: #333333;

            background: #ffffff;
        }


        .field input:focus {
            border-color: #006400;
        }


        .field label {
            position: absolute;

            top: 13px;
            left: 22px;

            color: #198754;

            font-size: 11px;

            pointer-events: none;
        }


        /* =========================================
           SELECT
        ========================================== */

        .field select {
            width: 100%;
            height: 50px;

            padding: 18px 22px 5px;

            border: 2px solid #198754;
            border-radius: 5px;

            outline: none;

            font-size: 14px;
            color: #333333;

            background: #ffffff;
        }


        .field select:focus {
            border-color: #006400;
        }


        /* =========================================
           PASSWORD FIELD
        ========================================== */

        .password-field input {
            padding-right: 75px;
        }


        .show-password {
            position: absolute;

            top: 14px;
            right: 21px;

            border: none;

            background: transparent;

            color: #aaaaaa;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }


        /* =========================================
           SIGN UP BUTTON
        ========================================== */

        .sign-in {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 6px;

            background: linear-gradient(
                90deg,
                #a768c5,
                #ca6db9
            );

            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.3s ease;
        }


        .sign-in:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }


        .sign-in:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }


        /* =========================================
           SIGN UP / LOGIN
        ========================================== */

        .signup {
            margin-top: 18px;

            text-align: center;

            color: #b6b3b6;

            font-size: 14px;
        }


        .signup a {
            color: #7514a4;
            text-decoration: none;
        }


        .signup a:hover {
            text-decoration: underline;
        }


        /* =========================================
           MESSAGE
        ========================================== */

        .message {
            display: none;

            margin-bottom: 15px;

            padding: 11px 14px;

            border-radius: 5px;

            font-size: 13px;

            text-align: center;
        }


        .message.error {
            display: block;

            background: #fff0f0;

            color: #d90000;

            border: 1px solid #ffcccc;
        }


        .message.success {
            display: block;

            background: #e9f8ef;

            color: #087a35;

            border: 1px solid #b7e4c7;
        }


        /* =========================================
           TABLET
        ========================================== */

        @media (max-width: 1000px) {

            .image-side {
                width: 30%;
            }


            .divider {
                width: 3%;
            }


            .form-side {
                width: 67%;
                padding: 35px 25px;
            }


            .side-logo {
                width: 125px;
                left: 22px;
            }

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 650px) {

            html,
            body {
                width: 100%;
                overflow-x: hidden;
            }


            .login-page {
                display: block;

                width: 100%;
                min-height: 100vh;

                overflow: visible;
            }


            /* IMAGE */

            .image-side {
                width: 100%;

                height: 220px;
                min-height: 220px;
                max-height: 220px;
            }


            .side-image {
                width: 100%;
                height: 220px;

                object-fit: cover;
                object-position: center center;
            }


            .side-logo {
                top: 20px;
                left: 20px;

                width: 120px;
                max-width: 38%;
            }


            /* HIDE DIVIDER */

            .divider {
                display: none;
            }


            /* FORM */

            .form-side {
                width: 100%;

                min-height: calc(100vh - 220px);

                padding: 35px 20px 45px;

                display: flex;

                align-items: flex-start;

                justify-content: center;
            }


            .login-container {
                width: 100%;
                max-width: 100%;

                margin: 0;
            }


            /* TITLE */

            h1 {
                font-size: 27px;

                line-height: 1.2;

                margin-bottom: 12px;
            }


            /* INTRO */

            .intro {
                font-size: 14px;

                line-height: 1.45;

                margin-bottom: 25px;
            }


            /* FIELD */

            .field {
                margin-bottom: 22px;
            }


            .field input,
            .field select {
                height: 54px;

                font-size: 15px;

                padding-left: 18px;
                padding-right: 18px;
            }


            .field label {
                left: 18px;

                font-size: 11px;
            }


            /* PASSWORD */

            .password-field input {
                padding-right: 70px;
            }


            .show-password {
                right: 16px;
                top: 16px;

                font-size: 13px;
            }


            /* BUTTON */

            .sign-in {
                height: 54px;

                font-size: 15px;

                border-radius: 7px;
            }


            /* SIGN UP */

            .signup {
                font-size: 13px;

                margin-top: 17px;
            }


            /* MESSAGE */

            .message {
                font-size: 12px;
            }

        }


        /* =========================================
           SMALL MOBILE
        ========================================== */

        @media (max-width: 400px) {

            .image-side,
            .side-image {
                height: 190px;

                min-height: 190px;
                max-height: 190px;
            }


            .form-side {
                min-height: calc(100vh - 190px);

                padding: 28px 16px 40px;
            }


            .side-logo {
                width: 105px;

                top: 17px;
                left: 16px;
            }


            h1 {
                font-size: 25px;
            }


            .intro {
                font-size: 13px;
            }


            .field input,
            .field select {
                height: 52px;
            }

        }

		.terms-agreement {
		    font-size: 13px;
		    line-height: 1.5;
		    text-align: center;
		    margin-bottom: 15px;
		    color: #666;
		}
		
		.terms-agreement a {
		    color: #007bff;
		    text-decoration: none;
		    font-weight: 600;
		}
		
		.terms-agreement a:hover {
		    text-decoration: underline;
		}

    </style>

</head>


<body>


    <!-- =========================================
         SIGN UP PAGE
    ========================================== -->

    <div class="login-page">


        <!-- =====================================
             IMAGE SIDE
        ====================================== -->

        <section class="image-side">

            <img
                src="assets/standing.png"
                alt="Bestwing Global Service Collect"
                class="side-image"
            >

            <img
                src="assets/logos.png"
                alt="Bestwing Global Service Collect"
                class="side-logo"
            >

        </section>


        <!-- =====================================
             DIVIDER
        ====================================== -->

        <div class="divider"></div>


        <!-- =====================================
             REGISTRATION FORM
        ====================================== -->

        <section class="form-side">

            <div class="login-container">


                <!-- =================================
                     TITLE
                ================================== -->

                <h1>
                    Sign Up
                </h1>


                <!-- =================================
                     DESCRIPTION
                ================================== -->

                <p class="intro">

                    Create your Bestwing Collect account.
                    <br>

                    Your information is kept confidential.

                </p>


                <!-- =================================
                     MESSAGE
                ================================== -->

                <div
                    id="message"
                    class="message">
                </div>


                <!-- =================================
                     REGISTRATION FORM
                ================================== -->

                <form id="registerForm">


                    <!-- =================================
                         FULL NAME
                    ================================== -->

                    <div class="field">

                        <label for="full_name">
                            Full Name *
                        </label>

                        <input
                            type="text"
                            id="full_name"
                            name="full_name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <!-- =================================
                         GENDER
                    ================================== -->

                    <div class="field">

                        <label for="gender">
                            Gender *
                        </label>

                        <select
                            id="gender"
                            name="gender"
                            required
                        >

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- =================================
                         PHONE NUMBER
                    ================================== -->

                    <div class="field">

                        <label for="phone_number">
                            Phone Number *
                        </label>

                        <input
                            type="tel"
                            id="phone_number"
                            name="phone_number"
                            autocomplete="tel"
                            required
                        >

                    </div>


                    <!-- =================================
                         EMAIL
                    ================================== -->

                    <div class="field">

                        <label for="email">
                            Email *
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- =================================
                         REFERRAL
                    ================================== -->

                    <div class="field">

                        <label for="referral">
                            Referral ID (Optional)
                        </label>

                        <input
                            type="text"
                            id="referral"
                            name="referral"
                        >

                    </div>


                    <!-- =================================
                         PASSWORD
                    ================================== -->

                    <div class="field password-field">

                        <label for="password">
                            Enter Your Password *
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            Show
                        </button>

                    </div>


                    <!-- =================================
                         REGISTER BUTTON
                    ================================== -->

                   <!-- =================================
					     TERMS & PRIVACY AGREEMENT
					================================== -->
					
					<div class="terms-agreement">
					    By creating an account you agree to our
					    <a href="https://bestwing.com.ng/foodconcept/public/terms.pdf" target="_blank">Terms & Conditions</a>
					    and
					    <a href="https://bestwing.com.ng/foodconcept/public/privacy1.pdf" target="_blank">Privacy Policy</a>.
					</div>
					
					<!-- =================================
					     REGISTER BUTTON
					================================== -->
					
					<button
					    type="submit"
					    class="sign-in"
					    id="registerButton"
					>
					    Sign Up
					</button>


                    <!-- =================================
                         LOGIN
                    ================================== -->

                    <div class="signup">

                        Already have an account?

                        <a href="/login.html">
                            Login
                        </a>

                    </div>


                </form>

            </div>

        </section>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* =========================================
           GET ELEMENTS
        ========================================== */

        const registerForm =
            document.getElementById(
                "registerForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        const registerButton =
            document.getElementById(
                "registerButton"
            );


        const password =
            document.getElementById(
                "password"
            );


        const showPassword =
            document.getElementById(
                "showPassword"
            );


        /* =========================================
           SHOW / HIDE PASSWORD
        ========================================== */

        showPassword.addEventListener(
            "click",
            function () {

                if (
                    password.type ===
                    "password"
                ) {

                    password.type =
                        "text";

                    showPassword.textContent =
                        "Hide";

                }

                else {

                    password.type =
                        "password";

                    showPassword.textContent =
                        "Show";

                }

            }
        );


        /* =========================================
           REGISTRATION
        ========================================== */

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /* =================================
                   CLEAR MESSAGE
                ================================== */

                message.className =
                    "message";

                message.textContent =
                    "";


                /* =================================
                   GET FORM DATA
                ================================== */

                const formData =
                    new FormData(
                        registerForm
                    );


                const body =
                    Object.fromEntries(
                        formData.entries()
                    );


                /* =================================
                   REMOVE EXTRA SPACES
                ================================== */

                body.full_name =
                    body.full_name.trim();


                body.email =
                    body.email.trim();


                body.phone_number =
                    body.phone_number.trim();


                body.gender =
                    body.gender.trim();


                body.referral =
                    body.referral.trim();


                /* =================================
                   PASSWORD VALIDATION
                ================================== */

                if (
                    body.password.length < 6
                ) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    message.className =
                        "message error";

                    return;

                }


                /* =================================
                   DISABLE BUTTON
                ================================== */

                registerButton.disabled =
                    true;


                registerButton.textContent =
                    "Creating Account...";


                try {


                    /* =============================
                       SEND REGISTRATION REQUEST
                    ============================== */

                    const response =
                        await fetch(
                            "/api/auth/register",
                            {

                                method:
                                    "POST",

                                headers:
                                    {
                                        "Content-Type":
                                            "application/json"
                                    },

                                body:
                                    JSON.stringify(
                                        body
                                    )

                            }
                        );


                    /* =============================
                       READ SERVER RESPONSE
                    ============================== */

                    const data =
                        await response.json();


                    /* =============================
                       CHECK SERVER ERROR
                    ============================== */

                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            data.message ||
                            "Registration failed."
                        );

                    }


                    /* =============================
                       CHECK USER ID
                    ============================== */

                    if (
                        !data.user_id
                    ) {

                        throw new Error(
                            "Registration succeeded but user ID was not returned."
                        );

                    }


                    /* =============================
                       SAVE USER ID
                    ============================== */

                    localStorage.setItem(
                        "registration_user_id",
                        data.user_id
                    );


                    /* =============================
                       SHOW SUCCESS MESSAGE
                    ============================== */

                    message.textContent =
                        "Registration successful. Redirecting to payment...";

                    message.className =
                        "message success";


                    /* =============================
                       REDIRECT TO PAYMENT
                    ============================== */

                    setTimeout(
                        function () {

                            window.location.href =
                                "/payment.html";

                        },
                        700
                    );


                }

                catch (error) {


                    /* =============================
                       SHOW ERROR
                    ============================== */

                    console.error(
                        "Registration error:",
                        error
                    );


                    message.textContent =
                        error.message ||
                        "Unable to complete registration.";

                    message.className =
                        "message error";


                    /* =============================
                       ENABLE BUTTON AGAIN
                    ============================== */

                    registerButton.disabled =
                        false;


                    registerButton.textContent =
                        "Sign Up";

                }

            }
        );

    </script>

<script>
	document.addEventListener("DOMContentLoaded", function () {
	
	    const params =
	        new URLSearchParams(window.location.search);
	
	    const referral =
	        params.get("referral");
	
	    if (referral) {
	
	        const referralInput =
	            document.getElementById("referral");
	
	        if (referralInput) {
	
	            referralInput.value = referral;
	
	            /*
	            | Optional:
	            | Prevent the user from changing the referral
	            | account number.
	            */
	
	            referralInput.readOnly = true;
	        }
	    }
	
	});
</script>
</body>

</html>

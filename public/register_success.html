<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Payment Verification
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

<div
    class="container"
    style="max-width: 500px; margin-top: 100px;"
>

    <div class="card shadow border-0">

        <div class="card-body text-center p-5">

            <div id="paymentStatus">

                <div
                    class="spinner-border text-primary mb-3"
                ></div>

                <h4>
                    Verifying Payment...
                </h4>

                <p class="text-muted">
                    Please wait while we confirm your payment.
                </p>

            </div>

        </div>

    </div>

</div>


<script>

/*
|--------------------------------------------------------------------------
| REGISTRATION PAYMENT VERIFICATION
|--------------------------------------------------------------------------
|
| This page verifies the ₦5,000 registration payment.
|
| It does NOT require JWT authentication because the user
| has not logged in yet.
|
|--------------------------------------------------------------------------
*/

async function verifyPayment() {

    const statusBox =
        document.getElementById("paymentStatus");


    /*
    |--------------------------------------------------------------------------
    | GET PAYSTACK REFERENCE
    |--------------------------------------------------------------------------
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const reference =
        params.get("reference") ||
        params.get("trxref");


    console.log(
        "REGISTRATION PAYSTACK REFERENCE:",
        reference
    );


    /*
    |--------------------------------------------------------------------------
    | CHECK REFERENCE
    |--------------------------------------------------------------------------
    */

    if (!reference) {

        statusBox.innerHTML = `

            <div class="text-danger">

                <div
                    style="
                        font-size:60px;
                        font-weight:bold;
                    "
                >
                    ✕
                </div>

                <h4>
                    Payment Reference Missing
                </h4>

                <p>
                    We could not find the Paystack
                    payment reference.
                </p>

                <a
                    href="/payment.html"
                    class="btn btn-primary"
                >
                    Return to Payment
                </a>

            </div>

        `;

        return;
    }


    /*
    |--------------------------------------------------------------------------
    | VERIFY REGISTRATION PAYMENT
    |--------------------------------------------------------------------------
    */

    try {

        const response =
            await fetch(
                "/api/payments/registration/verify/" +
                encodeURIComponent(reference),
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        /*
        |--------------------------------------------------------------------------
        | CHECK RESPONSE TYPE
        |--------------------------------------------------------------------------
        */

        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if (
            !contentType.includes(
                "application/json"
            )
        ) {

            const text =
                await response.text();


            console.error(
                "SERVER RETURNED:",
                text
            );


            throw new Error(
                "Payment server returned an invalid response. HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "REGISTRATION PAYMENT RESULT:",
            result
        );


        /*
        |--------------------------------------------------------------------------
        | SUCCESS
        |--------------------------------------------------------------------------
        */

        if (
            response.ok &&
            result.success
        ) {

            /*
            |--------------------------------------------------------------------------
            | SAVE USER ID
            |--------------------------------------------------------------------------
            */

            if (result.user_id) {

                localStorage.setItem(
                    "registration_user_id",
                    result.user_id
                );

            }


            statusBox.innerHTML = `

                <div class="text-success">

                    <div
                        style="
                            font-size:70px;
                            font-weight:bold;
                        "
                    >
                        ✓
                    </div>

                    <h4>
                        Registration Successful
                    </h4>

                    <p class="text-muted">
                        Your ₦5,000 registration payment
                        has been verified successfully.
                    </p>

                    <p>
                        Your account has been activated.
                    </p>

                    <hr>


                    <div class="mb-3">

                        <small class="text-muted">
                            Amount Paid
                        </small>

                        <h5>
                            ₦5,000.00
                        </h5>

                    </div>


                    <div class="mb-3">

                        <small class="text-muted">
                            Reference
                        </small>

                        <div>
                            <strong>
                                ${
                                    result.reference ||
                                    reference
                                }
                            </strong>
                        </div>

                    </div>


                    ${
                        result.account
                            ? `
                                <div class="mb-3">

                                    <small class="text-muted">
                                        Account Number
                                    </small>

                                    <h5>
                                        ${
                                            result.account.accountno ||
                                            result.account.account_number ||
                                            ""
                                        }
                                    </h5>

                                </div>
                            `
                            : ""
                    }


                    <a
                        href="/login.html"
                        class="btn btn-success w-100"
                    >
                        Continue to Login
                    </a>

                </div>

            `;

            return;
        }


        /*
        |--------------------------------------------------------------------------
        | PAYMENT FAILED
        |--------------------------------------------------------------------------
        */

        statusBox.innerHTML = `

            <div class="text-danger">

                <div
                    style="
                        font-size:70px;
                        font-weight:bold;
                    "
                >
                    ✕
                </div>

                <h4>
                    Payment Verification Failed
                </h4>

                <p>
                    ${
                        result.message ||
                        "We could not verify this payment."
                    }
                </p>


                <p class="small text-muted">

                    Reference:
                    ${reference}

                </p>


                <a
                    href="/payment.html"
                    class="btn btn-primary"
                >
                    Return to Payment
                </a>

            </div>

        `;

    } catch (error) {

        console.error(
            "REGISTRATION PAYMENT VERIFICATION ERROR:",
            error
        );


        statusBox.innerHTML = `

            <div class="text-danger">

                <div
                    style="
                        font-size:60px;
                        font-weight:bold;
                    "
                >
                    ✕
                </div>

                <h4>
                    Payment Verification Failed
                </h4>

                <p>
                    ${error.message}
                </p>


                <p class="small text-muted">

                    Reference:
                    ${reference}

                </p>


                <button
                    onclick="verifyPayment()"
                    class="btn btn-primary"
                >
                    Try Again
                </button>


                <a
                    href="/login.html"
                    class="btn btn-secondary ms-2"
                >
                    Login
                </a>

            </div>

        `;

    }

}


/*
|--------------------------------------------------------------------------
| START VERIFICATION
|--------------------------------------------------------------------------
*/

verifyPayment();

</script>

</body>

</html>

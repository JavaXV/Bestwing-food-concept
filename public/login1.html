<!doctype html>

<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="utf-8">


    <!-- Responsive viewport -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >


    <!-- Page title -->
    <title>
        Login
    </title>


    <!-- Bootstrap 5.3.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


    <!-- Main container -->
    <div class="container py-5">


        <!-- Center the login card -->
        <div class="row justify-content-center">


            <!-- Login card -->
            <div class="col-md-5">


                <div class="card p-4">


                    <!-- Login heading -->
                    <h2 class="brand">

                        Login

                    </h2>


                    <!-- Login message -->
                    <div id="msg"></div>


                    <!-- Login form -->
                    <form id="loginForm">


                        <!-- Phone number -->
                        <label class="form-label">

                            Phone number

                        </label>


                        <input
                            name="phone_number"
                            class="form-control mb-3"
                            required
                        >


                        <!-- Password -->
                        <label class="form-label">

                            Password

                        </label>


                        <input
                            name="password"
                            type="password"
                            class="form-control"
                            required
                        >


                        <!-- Login button -->
                        <button
                            type="submit"
                            class="btn btn-primary w-100 mt-4"
                        >

                            Login

                        </button>


                    </form>


                    <!-- Navigation links -->
                    <div class="text-center mt-3">


                        <!-- Registration -->
                        <a href="/register.html">

                            Create account

                        </a>


                        <span>
                            ·
                        </span>


                        <!-- Admin -->
                        <a href="/admin.html">

                            Admin

                        </a>


                    </div>


                </div>

            </div>

        </div>

    </div>


    <!-- Login JavaScript -->
    <script>

        /*
        |--------------------------------------------------------------------------
        | LOGIN FORM
        |--------------------------------------------------------------------------
        */

        document.getElementById(
            'loginForm'
        ).onsubmit = async (e) => {


            /*
            |--------------------------------------------------------------------------
            | PREVENT NORMAL FORM SUBMISSION
            |--------------------------------------------------------------------------
            */

            e.preventDefault();


            /*
            |--------------------------------------------------------------------------
            | MESSAGE ELEMENT
            |--------------------------------------------------------------------------
            */

            const msg =
                document.getElementById(
                    'msg'
                );


            try {


                /*
                |--------------------------------------------------------------------------
                | SEND LOGIN REQUEST
                |--------------------------------------------------------------------------
                */

                const r = await fetch(

                    '/api/auth/login',

                    {

                        method: 'POST',

                        headers: {

                            'Content-Type':
                                'application/json'

                        },

                        body: JSON.stringify(

                            Object.fromEntries(

                                new FormData(
                                    e.target
                                )

                            )

                        )

                    }

                );


                /*
                |--------------------------------------------------------------------------
                | GET API RESPONSE
                |--------------------------------------------------------------------------
                */

                const d =
                    await r.json();


                /*
                |--------------------------------------------------------------------------
                | CHECK API RESPONSE
                |--------------------------------------------------------------------------
                */

                if (!r.ok) {

                    throw new Error(
                        d.message
                    );

                }


                /*
                |--------------------------------------------------------------------------
                | SAVE JWT TOKEN
                |--------------------------------------------------------------------------
                */

                localStorage.setItem(

                    'token',

                    d.token

                );


                /*
                |--------------------------------------------------------------------------
                | REDIRECT TO DASHBOARD
                |--------------------------------------------------------------------------
                */

                location.href =
                    'dashboard.html';


            } catch (x) {


                /*
                |--------------------------------------------------------------------------
                | DISPLAY LOGIN ERROR
                |--------------------------------------------------------------------------
                */

                msg.innerHTML =

                    `
                    <div class="alert alert-danger">

                        ${x.message}

                    </div>
                    `;

            }

        };

    </script>


</body>

</html>
